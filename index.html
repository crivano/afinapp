<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfinApp — afinador de notas para canto</title>
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Fonte musical (SMuFL). Se não carregar (offline), usa a fonte do sistema. */
  @font-face{
    font-family:'Bravura';
    src: local('Bravura'),
         url('https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/Bravura.woff') format('woff');
    font-display: swap;
  }
  :root{
    --bg:#0d1117; --card:#151b26; --line:#2a3346; --tx:#e8edf6; --mut:#8b98ad;
    --acc:#7db3ff; --ok:#3ddc84; --warn:#ffb03a; --err:#ff5f6d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,'Segoe UI',Roboto,sans-serif; color:var(--tx);
    background:radial-gradient(1200px 700px at 50% -10%, #1a2436 0%, var(--bg) 60%);
    min-height:100vh;
  }
  header{display:flex; justify-content:space-between; align-items:center; gap:10px 18px; padding:12px 18px; flex-wrap:wrap}
  .brand h1{font-size:17px; margin:0; font-weight:650; white-space:nowrap}
  .brand h1 span{color:var(--mut); font-weight:400}
  .status{display:none; margin-top:3px; font-size:12.5px}
  .status.err{display:block; color:var(--err)}
  .hbtns{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .btn{border:1px solid var(--line); background:#1b2333; color:var(--tx); padding:9px 13px; border-radius:10px; font-size:13px; cursor:pointer}
  .btn:hover{border-color:var(--acc)}
  .btn.on{border-color:var(--acc); color:#bcd7ff; background:#1d2c49}
  main{width:100%; margin:0; padding:0 0 20px; display:grid; gap:14px}
  .viz{width:100%}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 20px; margin:0 14px}
  svg#staff{width:min(96vw,1100px); height:auto; display:block; margin:0 auto}
  .sl{stroke:#8fa0bd; stroke-width:2}
  .clef{fill:#dfe6f2}
  .clB{font-family:'Bravura'}
  .clF{font-family:'Segoe UI Symbol','Noto Music',serif}
  .sacc{font-size:36px; fill:#dfe6f2; font-family:'Segoe UI Symbol','Noto Music',serif}
  .stem{stroke-width:2.4; fill:none; stroke-linecap:round}
  .hide{display:none!important}
  #piano{width:100%; height:auto; max-height:62vh; display:block; touch-action:none; user-select:none}
  .wkg,.bkg{cursor:pointer}
  .wk{fill:#f2f5fa; stroke:#0d1117; stroke-width:1.2}
  .bk{fill:#151a24; stroke:#05070b; stroke-width:1}
  .wl{fill:#8b98ad; font-size:11px; text-anchor:middle; pointer-events:none}
  /* mini-pauta desenhada nas teclas brancas */
  .mkw{stroke:#dde4f0; stroke-width:.9}
  .mcw{fill:#77839a}
  .mcB{font-family:'Bravura'}
  .mcF{font-family:'Segoe UI Symbol','Noto Music',serif}
  .mnw{fill:#77839a}
  .mlw{stroke:#a9b6cc; stroke-width:.9}
  .wkg.lit .mnw,.wkg.lit .mcw{fill:#12203a}
  .wkg.lit .mkw,.wkg.lit .mlw{stroke:#3d5372}
  .pianohint{margin:8px 0 0; color:var(--mut); font-size:12.5px; text-align:center}
  .controls{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-top:6px}
  .seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{background:none; border:none; color:var(--mut); padding:8px 14px; cursor:pointer; font-size:14px}
  .seg button.on{background:#1d2c49; color:#bcd7ff}
  .a4ctl{display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  #a4tgl{border:none; background:#1b2333; color:var(--tx); padding:9px 13px; font-size:13px; cursor:pointer}
  #a4tgl:hover{color:#bcd7ff}
  #a4tgl.on{background:#1d2c49; color:#bcd7ff}
  #a4body{display:flex; align-items:center; gap:7px; padding:0 9px 0 2px; color:var(--mut); font-size:13px}
  #a4body b{color:var(--tx); min-width:62px; text-align:center; font-variant-numeric:tabular-nums}
  #a4body button{width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#141b28; color:var(--tx); cursor:pointer; font-size:15px}
  .readout{text-align:center; padding:22px}
  .note{font-size:clamp(64px,14vw,110px); font-weight:700; line-height:1; letter-spacing:1px}
  .note.dim{opacity:.35}
  .note.intune{color:var(--ok); text-shadow:0 0 26px rgba(61,220,132,.35)}
  .note.near{color:#ffd27a}
  .note .acc{font-style:normal; font-size:.8em}
  .note .oct{font-size:.38em; vertical-align:super; color:var(--acc); letter-spacing:0}
  .sub{color:var(--mut); font-size:15px; margin-top:8px; min-height:20px; font-variant-numeric:tabular-nums}
  .tuner{margin:18px auto 4px; max-width:560px}
  .bar{position:relative; height:16px; border-radius:8px; opacity:.9;
       background:linear-gradient(90deg,#ff5f6d 0%,#ff5f6d 14%,#ffb03a 34%,#3ddc84 42%,#3ddc84 58%,#ffb03a 66%,#ff5f6d 86%,#ff5f6d 100%)}
  #needle{position:absolute; top:-6px; bottom:-6px; width:3px; background:#fff; border-radius:2px;
          left:50%; transform:translateX(-50%); box-shadow:0 0 8px #fff; transition:left 70ms linear}
  .ticks{display:flex; justify-content:space-between; color:var(--mut); font-size:11px; margin-top:7px; padding:0 2px}
  .meters{display:flex; gap:28px; justify-content:center; margin-top:18px; color:var(--mut); font-size:12px}
  .meters label{display:grid; gap:6px; justify-items:center}
  .m{width:150px; height:6px; background:#0e1420; border-radius:4px; overflow:hidden; border:1px solid var(--line)}
  .m i{display:block; height:100%; width:0; background:linear-gradient(90deg,#3ddc84,#7db3ff)}
  .histhead{color:var(--mut); font-size:13px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center}
  .mini{background:none; border:1px solid var(--line); color:var(--mut); border-radius:8px; font-size:12px; padding:3px 10px; cursor:pointer}
  #hist{display:flex; flex-wrap:wrap; gap:8px; max-height:112px; overflow-y:auto}
  #hist:empty::after{content:"— nenhuma nota ainda —"; color:var(--mut); font-size:13px; opacity:.6}
  #hist span{border:1px solid var(--line); border-radius:9px; padding:5px 10px; font-size:14px; background:#101724}
  #hist span:last-child{border-color:var(--acc); color:var(--acc)}
  footer{width:100%; margin:0; padding:0 24px 26px; color:var(--mut); font-size:12.5px; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>🎼 AfinApp <span>— afinador de notas para canto</span></h1>
    <div id="status" class="status" hidden></div>
  </div>
  <div class="hbtns">
    <button id="btnMic" class="btn" type="button" title="Ligar/desligar o microfone">Microfone</button>
    <div class="seg" id="segClef">
      <button data-clef="auto" class="on" type="button">Auto</button>
      <button data-clef="sol" type="button">Clave de Sol</button>
      <button data-clef="fa" type="button">Clave de Fá</button>
      <button data-clef="piano" type="button">Piano</button>
    </div>
    <button id="tglRead" class="btn on" type="button" title="Mostrar/ocultar o painel de leitura (nota, cents, sinal)">Leitura</button>
    <button id="tglHist" class="btn on" type="button" title="Mostrar/ocultar o histórico de notas">Histórico</button>
    <div class="a4ctl">
      <button id="a4tgl" type="button" title="Afinação de referência (A4)">Referência</button>
      <span id="a4body" class="hide">
        <button id="a4dn" type="button" aria-label="Diminuir A4">−</button>
        <b id="a4val">440 Hz</b>
        <button id="a4up" type="button" aria-label="Aumentar A4">+</button>
      </span>
    </div>
  </div>
</header>

<main>
  <section class="viz">
    <svg id="staff" viewBox="0 0 900 290" preserveAspectRatio="xMidYMid meet" aria-label="Pauta musical"></svg>
    <svg id="piano" class="hide" viewBox="0 0 1128 210" preserveAspectRatio="xMidYMid meet" aria-label="Teclado de piano"></svg>
    <p id="pianoHint" class="pianohint hide">Clique e segure uma tecla para ouvir a nota de referência — cante junto.</p>
  </section>

  <section class="card readout" id="cardRead">
    <div id="noteName" class="note">—</div>
    <div id="noteSub" class="sub">cante uma nota sustentada</div>
    <div class="tuner">
      <div class="bar"><div id="needle"></div></div>
      <div class="ticks"><span>−50</span><span>−25</span><span>0</span><span>+25</span><span>+50</span></div>
    </div>
    <div class="meters">
      <label>sinal<div class="m"><i id="mLvl"></i></div></label>
      <label>nitidez<div class="m"><i id="mClr"></i></div></label>
    </div>
  </section>

  <section class="card" id="cardHist">
    <div class="histhead">Notas cantadas <button id="histClr" class="mini" type="button">limpar</button></div>
    <div id="hist"></div>
  </section>
</main>
</body>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ---------------- parâmetros ---------------- */
const PITCH_MIN_F = 55;      // A1 — limite grave (vozes de baixo)
const PITCH_MAX_F = 1300;    // ~E6 — limite agudo
const RMS_GATE    = 0.004;   // limiar de volume para considerar voz
const CLARITY_GATE= 0.60;    // limiar de periodicidade (NSDF)
const K_MPM       = 0.90;    // MPM: aceita o 1º pico ≥ 90% do pico máximo

/* ---------------- estado ---------------- */
let audioCtx=null, analyser=null, buf=null;
let xbuf=null, eprefix=null, nsdf=null, tauMin=0, tauMax=0;
let micOn=false;
/* defaults de primeiro uso: modo Piano, sem Leitura e sem Histórico;
   preferências salvas no localStorage sobrepõem (loadPrefs) */
let a4=440, vizMode='piano', effClef='sol';
let rd=false, hs=false;
let bravura=false;

let histRaw=[], unvoiced=99, idle=true;
let shownNote=null, centsDisp=0, lastNoteMidi=null, noteFirstSeen=0, lastLogged=null;
let recentMidis=[], tuneClass=2, lastDrawKey='';

/* ---------------- notas ---------------- */
const LETTERS=['C','D','E','F','G','A','B'];
const SOLF=['Dó','Ré','Mi','Fá','Sol','Lá','Si'];
// grafia: pc -> [índice da letra, acidente]  (Mib, Sib preferem bemol)
const PC={0:[0,''],1:[0,'#'],2:[1,''],3:[2,'b'],4:[2,''],5:[3,''],6:[3,'#'],7:[4,''],8:[4,'#'],9:[5,''],10:[6,'b'],11:[6,'']};

function noteInfo(midiNote){
  const pc=((midiNote%12)+12)%12, oct=Math.floor(midiNote/12)-1;
  const [l,acc]=PC[pc];
  return {letter:LETTERS[l], solf:SOLF[l], acc, oct, dia:oct*7+l};
}

function median(a){
  const s=Array.from(a).sort((x,y)=>x-y), m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

/* ---------------- pauta (SVG) ---------------- */
const STAFF={gap:26, yB:170, xN:590, xC:100, HALF:13};
// métricas da clave com a fonte do sistema (ajustadas visualmente; Bravura usa a métrica SMuFL)
const FB={sol:{size:STAFF.gap*3.6, y:124}, fa:{size:STAFF.gap*3.3, y:97}};

function yDia(d,ref){ return STAFF.yB-(d-ref)*STAFF.HALF; }

function staffSVG(){
  const ref = effClef==='fa' ? 18 : 30;      // linha de baixo: Sol2 (Fá) / Mi4 (Sol)
  let s='';
  for(let k=0;k<5;k++){
    const y=STAFF.yB-k*STAFF.gap;
    s+=`<line x1="26" y1="${y}" x2="874" y2="${y}" class="sl"/>`;
  }
  // viewBox adaptativo: notas muito fora da pauta (ex.: grave forçado em clave de Sol)
  // expandem a área em vez de serem cortadas
  let yMin=10, yMax=280;
  const glyph = effClef==='fa' ? '𝄢' : '𝄞';
  if(bravura){
    // SMuFL: 1 em = altura da pauta (4 espaços); origem do glifo na própria linha da clave
    const cy = effClef==='fa' ? yDia(ref+6,ref) : yDia(ref+2,ref);
    s+=`<text x="${STAFF.xC}" y="${cy}" font-size="${STAFF.gap*4}" class="clef clB">${glyph}</text>`;
  }else{
    const m=FB[effClef];
    s+=`<text x="${STAFF.xC}" y="${m.y}" font-size="${m.size}" class="clef clF" dominant-baseline="middle">${glyph}</text>`;
  }
  if(lastNoteMidi!==null){
    const midi=Math.round(lastNoteMidi), n=noteInfo(midi);
    const y=yDia(n.dia,ref);
    yMin=Math.min(yMin,y-104); yMax=Math.max(yMax,y+104);
    let led='';
    if(n.dia<=ref-2){
      for(let k=1,c=Math.floor((ref-n.dia)/2); k<=c; k++){
        const ly=yDia(ref-2*k,ref);
        led+=`<line x1="${STAFF.xN-32}" y1="${ly}" x2="${STAFF.xN+32}" y2="${ly}" class="sl"/>`;
      }
    }else if(n.dia>=ref+10){
      for(let k=1,c=Math.floor((n.dia-(ref+8))/2); k<=c; k++){
        const ly=yDia(ref+8+2*k,ref);
        led+=`<line x1="${STAFF.xN-32}" y1="${ly}" x2="${STAFF.xN+32}" y2="${ly}" class="sl"/>`;
      }
    }
    let accEl='';
    if(n.acc) accEl=`<text x="${STAFF.xN-48}" y="${y+13}" class="sacc">${n.acc==='#'?'♯':'♭'}</text>`;
    const up  = n.dia <= ref+4;                       // haste para cima até a linha central
    const stem= up ? `M${STAFF.xN+15.2} ${y-1} V${y-92}` : `M${STAFF.xN-15.2} ${y+1} V${y+92}`;
    const col = idle ? '#7d8aa5' : (tuneClass===0 ? '#3ddc84' : '#7db3ff');
    const op  = idle ? 0.3 : 1;
    s+=`<g opacity="${op}">${led}${accEl}<path d="${stem}" class="stem" stroke="${col}"/>`+
       `<ellipse cx="${STAFF.xN}" cy="${y}" rx="17" ry="12" transform="rotate(-18 ${STAFF.xN} ${y})" fill="${col}"/></g>`;
  }
  $('staff').setAttribute('viewBox',`0 ${yMin} 900 ${yMax-yMin}`);
  $('staff').innerHTML=s;
  lastDrawKey=[Math.round(lastNoteMidi??-1),effClef,idle,tuneClass,bravura].join('|');
}

/* ---------------- piano ---------------- */
const PMIN=33, PMAX=84;              // A1..C6 — a mesma faixa detectada pelo afinador
const WKW=36, PAD=6, WKH=196, BKH=122, BKW=22;
const BK_OFF={1:-4, 3:4, 6:-5, 8:0, 10:5};   // pequenos deslocamentos estéticos das pretas

function keyPath(x,y,w,h,r){          // retângulo com base arredondada, como tecla real
  return `M${x} ${y} L${x} ${y+h-r} Q${x} ${y+h} ${x+r} ${y+h} L${x+w-r} ${y+h} Q${x+w} ${y+h} ${x+w} ${y+h-r} L${x+w} ${y} Z`;
}

/* mini-pauta nas teclas BRANCAS, logo acima do nome, na parte baixa da tecla.
   Clave só em duas teclas-marco: a primeira do teclado (região de Fá) e a
   primeira já da região de Sol (Dó4). Notas abaixo de Dó4 lêem em Fá,
   de Dó4 para cima em Sol. */
const MS={wGap:4.6, wBottom:166};
function miniStaff(m, x0, w, withClef){
  const ref = m<60 ? 18 : 30;
  const gap=MS.wGap, bottom=MS.wBottom, top=bottom-4*gap, half=gap/2;
  let s='';
  for(let i=0;i<5;i++){
    const ly=(bottom-i*gap).toFixed(1);
    s+=`<line x1="${x0}" y1="${ly}" x2="${x0+w}" y2="${ly}" class="mkw"/>`;
  }
  if(withClef){
    const glyph = ref===18 ? '𝄢' : '𝄞';
    if(bravura){
      const by = ref===18 ? top+gap : bottom-gap;     // métrica SMuFL: origem na linha da clave
      s+=`<text x="${x0+0.5}" y="${by.toFixed(1)}" font-size="${(4*gap).toFixed(1)}" class="mcB mcw">${glyph}</text>`;
    }else{
      const fs = ref===18 ? 3.3*gap : 3.6*gap;
      const cy = top+2*gap + (ref===18 ? -0.8*gap : 0.23*gap);
      s+=`<text x="${x0+0.5}" y="${cy.toFixed(1)}" font-size="${fs.toFixed(1)}" class="mcF mcw" dominant-baseline="middle">${glyph}</text>`;
    }
  }
  const ni=noteInfo(m);
  const y=bottom-(ni.dia-ref)*half;
  const nx = withClef ? x0+w-8 : x0+w/2;
  const lw=13;
  let led='';
  if(ni.dia<=ref-2){
    for(let k=1;k<=Math.floor((ref-ni.dia)/2);k++){
      const ly=(bottom+k*gap).toFixed(1);
      led+=`<line x1="${nx-lw/2}" y1="${ly}" x2="${nx+lw/2}" y2="${ly}" class="mlw"/>`;
    }
  }else if(ni.dia>=ref+10){
    for(let k=1;k<=Math.floor((ni.dia-(ref+8))/2);k++){
      const ly=(top-k*gap).toFixed(1);
      led+=`<line x1="${nx-lw/2}" y1="${ly}" x2="${nx+lw/2}" y2="${ly}" class="mlw"/>`;
    }
  }
  const nx1=nx.toFixed(1), y1=y.toFixed(1);
  return s+led+
    `<ellipse class="mnw" cx="${nx1}" cy="${y1}" rx="3.1" ry="2.1" transform="rotate(-18 ${nx1} ${y1})"/>`;
}

function buildPiano(){
  let s='', x=PAD;
  const whiteX=new Map();
  for(let m=PMIN;m<=PMAX;m++){
    const pc=m%12;
    if([1,3,6,8,10].includes(pc)) continue;
    whiteX.set(m,x);
    const ni=noteInfo(m);
    const lab = pc===0 ? ni.solf+ni.oct : ni.solf;
    const clef = (m===PMIN || m===60);          // Lá1 (1ª tecla, Fá) e Dó4 (1ª da região de Sol)
    s+=`<g data-midi="${m}" class="wkg"><path class="wk" d="${keyPath(x,PAD,WKW,WKH,6)}"/>`+
       miniStaff(m, x+4, WKW-8, clef)+
       `<text class="wl" x="${x+WKW/2}" y="${PAD+WKH-12}">${lab}</text></g>`;
    x+=WKW;
  }
  for(let m=PMIN;m<=PMAX;m++){
    const pc=m%12;
    if(![1,3,6,8,10].includes(pc)) continue;
    const nx=whiteX.get(m+1);        // fronteira com a branca seguinte
    if(nx==null) continue;
    const bx=nx-BKW/2+(BK_OFF[pc]||0);
    s+=`<g data-midi="${m}" class="bkg"><path class="bk" d="${keyPath(bx,PAD,BKW,BKH,4)}"/></g>`;
  }
  const svg=$('piano');
  svg.setAttribute('viewBox',`0 0 ${x+PAD} ${PAD+WKH+8}`);
  svg.innerHTML=s;
}

/* tecla acesa: cor por classe de altura, começando em Dó (vermelho) */
const PC_COLOR=['rgb(237,29,29)','rgb(237,133,29)','rgb(237,237,29)','rgb(133,237,29)',
                'rgb(29,237,29)','rgb(29,237,133)','rgb(29,237,237)','rgb(29,133,237)',
                'rgb(29,29,237)','rgb(133,29,237)','rgb(237,29,237)','rgb(237,29,133)'];
let detMidi=null;                    // tecla acesa pela detecção de voz
const pressed=new Set();             // teclas pressionadas (clique/toque)

function refreshKey(m){
  const g=$('piano').querySelector(`g[data-midi="${m}"]`);
  if(!g) return;
  if(m===detMidi || pressed.has(m)){
    g.classList.add('lit');
    g.querySelector('path').style.fill=PC_COLOR[((m%12)+12)%12];
  }else{
    g.classList.remove('lit');
    g.querySelector('path').style.fill='';
  }
}
/* nota cantada detectada acende a tecla; cliques acendem separadamente */
function litKey(midi){
  const old=detMidi;
  detMidi=midi;
  if(old!=null) refreshKey(old);
  if(midi!=null) refreshKey(midi);
}

/* som de referência: síntese simples tipo piano — parciais senoidais com
   ataque rápido e decaimento; sustenta enquanto a tecla estiver pressionada */
const held=new Map();
function noteOn(m){
  ensureCtx();
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(held.has(m)) return;
  const f=a4*Math.pow(2,(m-69)/12), t=audioCtx.currentTime;
  const master=audioCtx.createGain();
  master.gain.setValueAtTime(0.0001,t);
  master.gain.exponentialRampToValueAtTime(0.32,t+0.012);
  master.gain.exponentialRampToValueAtTime(0.14,t+1.5);
  master.connect(audioCtx.destination);
  const oscs=[[1,1],[2,.45],[3,.22],[4,.11],[5,.05],[6,.03]].map(([h,g])=>{
    const o=audioCtx.createOscillator(), gn=audioCtx.createGain();
    o.type='sine'; o.frequency.value=f*h; o.detune.value=h*2.5;
    gn.gain.value=g;
    o.connect(gn); gn.connect(master); o.start(t);
    return o;
  });
  held.set(m,{master,oscs});
}
function noteOff(m){
  const h=held.get(m); if(!h) return;
  const t=audioCtx.currentTime;
  try{
    h.master.gain.cancelScheduledValues(t);
    h.master.gain.setValueAtTime(Math.max(h.master.gain.value,0.0001),t);
    h.master.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    h.oscs.forEach(o=>o.stop(t+0.35));
  }catch(_){}
  held.delete(m);
}

/* toque/clique com glissando: arrastar pelo teclado toca cada tecla atravessada */
const ptrs=new Map();                // pointerId -> tecla atual (ou null fora do teclado)

function keyAt(x,y){
  const el=document.elementFromPoint(x,y);
  const g=el && el.closest ? el.closest('#piano g[data-midi]') : null;
  return g ? +g.dataset.midi : null;
}
function ptrSet(id, m){
  const cur=ptrs.get(id);
  if(cur===m) return;
  if(cur!=null){ noteOff(cur); pressed.delete(cur); refreshKey(cur); }
  if(m!=null){ noteOn(m); pressed.add(m); refreshKey(m); }
  ptrs.set(id, m);
}
$('piano').addEventListener('pointerdown', e=>{
  const m=keyAt(e.clientX,e.clientY);
  if(m==null) return;
  e.preventDefault();
  ptrs.set(e.pointerId, null);
  ptrSet(e.pointerId, m);
});
$('piano').addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrSet(e.pointerId, keyAt(e.clientX,e.clientY));
});
function ptrEnd(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrSet(e.pointerId, null);
  ptrs.delete(e.pointerId);
}
$('piano').addEventListener('pointerup', ptrEnd);
$('piano').addEventListener('pointercancel', ptrEnd);
window.addEventListener('pointerup', ptrEnd);
window.addEventListener('pointercancel', ptrEnd);

/* ---------------- áudio ---------------- */
function ensureCtx(){
  if(audioCtx){ if(audioCtx.state==='suspended') audioCtx.resume(); return; }
  audioCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;                 // ~43 ms de janela: bom equilíbrio latência × graves
  analyser.smoothingTimeConstant=0;
  buf=new Float32Array(analyser.fftSize);
  xbuf=new Float32Array(buf.length);
  eprefix=new Float32Array(buf.length+1);
  const sr=audioCtx.sampleRate;
  tauMin=Math.max(2, Math.floor(sr/PITCH_MAX_F));
  tauMax=Math.min(Math.floor(sr/PITCH_MIN_F), buf.length>>1);
  nsdf=new Float32Array(tauMax+2);
  requestAnimationFrame(loop);
}

/* MPM (McLeod Pitch Method) sobre xbuf (média já removida).
   Devolve {freq, clarity} ou null. Escolhe a MAIOR periodicidade forte
   (= menor frequência da série), não a mais energética. */
function mpm(){
  const W=buf.length, sr=audioCtx.sampleRate, E=eprefix;
  E[0]=0;
  for(let i=0;i<W;i++) E[i+1]=E[i]+xbuf[i]*xbuf[i];
  const Etot=E[W];
  let maxv=0;
  for(let tau=tauMin; tau<=tauMax; tau++){
    let sum=0;
    const lim=W-tau;
    for(let i=0;i<lim;i++) sum+=xbuf[i]*xbuf[i+tau];
    const m=(E[W-tau]-E[0])+(Etot-E[tau]);
    const v=m>1e-10 ? 2*sum/m : 0;
    nsdf[tau]=v;
    if(v>maxv) maxv=v;
  }
  if(maxv<CLARITY_GATE) return null;
  const peaks=[];
  for(let tau=tauMin+1; tau<tauMax; tau++){
    const v=nsdf[tau];
    if(v>0 && v>=nsdf[tau-1] && v>nsdf[tau+1]) peaks.push(tau);
  }
  if(!peaks.length) return null;
  const thr=K_MPM*maxv;
  let best=peaks[0];
  for(const p of peaks){
    if(nsdf[p]>=thr){ best=p; break; }        // primeiro pico quase tão forte quanto o máximo = fundamental
    if(nsdf[p]>nsdf[best]) best=p;
  }
  const y0=nsdf[best-1], y1=nsdf[best], y2=nsdf[best+1];
  const den=y0-2*y1+y2;
  let shift=den!==0 ? 0.5*(y0-y2)/den : 0;
  if(!(shift>-1 && shift<1)) shift=0;
  const clarity=Math.max(0, Math.min(1, y1-0.25*(y0-y2)*shift));
  return {freq:sr/(best+shift), clarity};
}

function meter(el,pct){
  el.style.width=Math.max(0,Math.min(100,pct))+'%';
}

function loop(){
  requestAnimationFrame(loop);
  if(!analyser) return;
  analyser.getFloatTimeDomainData(buf);
  const W=buf.length;
  let mean=0;
  for(let i=0;i<W;i++) mean+=buf[i];
  mean/=W;
  let e=0;
  for(let i=0;i<W;i++){ const v=buf[i]-mean; xbuf[i]=v; e+=v*v; }
  const rms=Math.sqrt(e/W);
  meter($('mLvl'), (20*Math.log10(rms+1e-7)+60)/60*100);
  const r = rms>RMS_GATE ? mpm() : null;
  meter($('mClr'), r ? r.clarity*100 : 0);
  let voiced=false, midi=0;
  if(r && r.clarity>=CLARITY_GATE){
    midi=69+12*Math.log2(r.freq/a4);
    if(midi>=33 && midi<=86) voiced=true;   // A1..D6: faixa vocal; fora disso é artefato
  }
  if(voiced){
    unvoiced=0;
    histRaw.push(midi);
    if(histRaw.length>5) histRaw.shift();
    idle=false;
    updateDisplay(median(histRaw));
  }else{
    unvoiced++;
    if(unvoiced>7 && !idle){ idle=true; histRaw.length=0; setIdle(); }
  }
}

/* ---------------- exibição ---------------- */
function updateDisplay(midi){
  const n=Math.round(midi);
  const c=(midi-n)*100;
  if(n===shownNote){
    centsDisp=Math.round(0.5*centsDisp+0.5*c);
  }else{
    shownNote=n; centsDisp=Math.round(c);
    noteFirstSeen=performance.now();
  }
  lastNoteMidi=midi;
  tuneClass = Math.abs(centsDisp)<=10 ? 0 : (Math.abs(centsDisp)<=25 ? 1 : 2);
  const info=noteInfo(n);
  const nn=$('noteName');
  nn.innerHTML = info.solf + (info.acc ? `<i class="acc">${info.acc==='#'?'♯':'♭'}</i>` : '') +
                 `<span class="oct">${info.oct}</span>`;
  nn.className = 'note' + (idle?' dim':'') + (tuneClass===0?' intune':(tuneClass===1?' near':''));
  const f=a4*Math.pow(2,(midi-69)/12);
  const sg=centsDisp>0?'+':(centsDisp<0?'−':'');
  $('noteSub').textContent=`${info.letter}${info.acc} · ${f.toFixed(1)} Hz · ${sg}${Math.abs(centsDisp)} cents`;
  $('needle').style.left=Math.max(2,Math.min(98,centsDisp+50))+'%';
  // clave automática (com histerese p/ não oscilar)
  recentMidis.push(n);
  if(recentMidis.length>40) recentMidis.shift();
  if(vizMode==='auto'){
    const med=median(recentMidis);
    if(med<=57 && effClef!=='fa') effClef='fa';
    else if(med>=60 && effClef!=='sol') effClef='sol';
  }
  if(vizMode==='piano'){
    litKey(n);
  }else{
    const key=[n,effClef,idle,tuneClass,bravura].join('|');
    if(key!==lastDrawKey) staffSVG();
  }
  logHistory(n);
}

function setIdle(){
  const nn=$('noteName');
  if(shownNote===null){ nn.textContent='—'; nn.className='note'; }
  else nn.className='note dim';
  $('noteSub').textContent='· · ·  ouvindo  · · ·';
  $('needle').style.left='50%';
  centsDisp=0; tuneClass=2;
  if(vizMode==='piano') litKey(null); else staffSVG();
}

function logHistory(n){
  const now=performance.now();
  if(now-noteFirstSeen>150 && lastLogged!==n){
    lastLogged=n;
    const info=noteInfo(n);
    const sp=document.createElement('span');
    sp.textContent=info.solf+(info.acc ? (info.acc==='#'?'♯':'♭') : '')+info.oct;
    const h=$('hist');
    h.appendChild(sp);
    while(h.children.length>40) h.removeChild(h.firstChild);
    h.scrollTop=h.scrollHeight;
  }
}

/* status: só erros aparecem (falha de microfone); mensagens normais ficam ocultas */
function setStatus(txt,kind){
  const el=$('status');
  if(kind==='err' && txt){ el.textContent=txt; el.hidden=false; }
  else{ el.textContent=''; el.hidden=true; }
}

/* ---------------- microfone (interruptor ligado/desligado) ---------------- */
let micStream=null, micSrc=null, micBusy=false;
function micBtn(on){
  $('btnMic').classList.toggle('on', on);
}
async function startMic(){
  if(micBusy || micOn) return;
  micBusy=true;
  try{
    ensureCtx();
    const st=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1}
    });
    micStream=st;
    micSrc=audioCtx.createMediaStreamSource(st);
    micSrc.connect(analyser);
    micOn=true;
    micBtn(true);
    setStatus();
  }catch(err){
    const why=err && err.name==='NotAllowedError' ? 'permissão negada pelo navegador.' :
              err && err.name==='NotFoundError'  ? 'nenhum microfone encontrado.' : (err && err.message) || 'erro desconhecido.';
    setStatus('Não foi possível acessar o microfone: '+why+' Se persistir, abra a página via http://localhost (ex.: python -m http.server).','err');
  }finally{
    micBusy=false;
  }
}
function stopMic(){
  if(micStream) micStream.getTracks().forEach(tr=>tr.stop());
  if(micSrc){ try{ micSrc.disconnect(); }catch(_){} }
  micStream=null; micSrc=null; micOn=false;
  histRaw.length=0; unvoiced=99;
  if(!idle){ idle=true; setIdle(); }
  micBtn(false);
  setStatus();
}

/* ---------------- eventos ---------------- */
$('btnMic').addEventListener('click', ()=>{ micOn ? stopMic() : startMic(); });
$('histClr').addEventListener('click', ()=>{ $('hist').innerHTML=''; lastLogged=null; });
/* preferências persistidas (modo de visualização, painéis, referência) */
let a4Open=false;
function setA4Open(on){
  a4Open=on;
  $('a4tgl').classList.toggle('on', on);
  $('a4body').classList.toggle('hide', !on);
}
function savePrefs(){
  try{ localStorage.setItem('afinador-canto', JSON.stringify({v:vizMode, r:rd, h:hs, a:a4, o:a4Open})); }catch(_){}
}
function setReadout(on){
  rd=on;
  $('cardRead').classList.toggle('hide', !on);
  $('tglRead').classList.toggle('on', on);
}
function setHistory(on){
  hs=on;
  $('cardHist').classList.toggle('hide', !on);
  $('tglHist').classList.toggle('on', on);
}
function loadPrefs(){
  let p=null;
  try{ p=JSON.parse(localStorage.getItem('afinador-canto')||'null'); }catch(_){}
  if(p){
    if(['auto','sol','fa','piano'].includes(p.v)) vizMode=p.v;
    if(typeof p.a==='number' && p.a>=415 && p.a<=465){ a4=Math.round(p.a); $('a4val').textContent=a4+' Hz'; }
    if(typeof p.r==='boolean') rd=p.r;
    if(typeof p.h==='boolean') hs=p.h;
    if(typeof p.o==='boolean') a4Open=p.o;
  }
  /* sincroniza o DOM com o estado, seja default de 1º uso, seja pref salva */
  setReadout(rd); setHistory(hs); setA4Open(a4Open);
}

function applyVizMode(){
  for(const x of $('segClef').children) x.classList.toggle('on', x.dataset.clef===vizMode);
  const piano = vizMode==='piano';
  $('staff').classList.toggle('hide', piano);
  $('piano').classList.toggle('hide', !piano);
  $('pianoHint').classList.toggle('hide', !piano);
  if(piano){
    litKey(detMidi);
  }else{
    if(vizMode!=='auto') effClef=vizMode;
    else{
      const med=recentMidis.length?median(recentMidis):70;
      effClef = med<=58 ? 'fa' : 'sol';
    }
    staffSVG();
  }
}

$('segClef').addEventListener('click', e=>{
  const b=e.target.closest('button');
  if(!b) return;
  vizMode=b.dataset.clef;
  applyVizMode();
  savePrefs();
});
$('tglRead').addEventListener('click', ()=>{ setReadout(!rd); savePrefs(); });
$('tglHist').addEventListener('click', ()=>{ setHistory(!hs); savePrefs(); });
$('a4tgl').addEventListener('click', ()=>{ setA4Open(!a4Open); savePrefs(); });
$('a4up').addEventListener('click', ()=>{ a4=Math.min(465,a4+1); $('a4val').textContent=a4+' Hz'; savePrefs(); });
$('a4dn').addEventListener('click', ()=>{ a4=Math.max(415,a4-1); $('a4val').textContent=a4+' Hz'; savePrefs(); });

/* fonte da clave: tenta Bravura (métrica exata); senão usa fonte do sistema.
   Ao carregar/trocar a fonte, a pauta e as mini-pautas do piano são redesenhadas. */
if(document.fonts){
  document.fonts.load('104px Bravura').then(fs=>{
    bravura=!!(fs&&fs.length)&&document.fonts.check('104px Bravura');
    staffSVG(); buildPiano();
    litKey(detMidi);                // reaplica a tecla acesa após redesenhar
  }).catch(()=>{});
  document.fonts.ready.then(()=>{
    const b=document.fonts.check('104px Bravura');
    if(b!==bravura){ bravura=b; staffSVG(); buildPiano(); }
  });
}

loadPrefs();
applyVizMode();
buildPiano();

/* PWA: registra o service worker (cache offline + instalação).
   Em file:// o registro não é contexto válido — o app segue igual sem ele. */
if ('serviceWorker' in navigator && location.protocol !== 'file:')
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
</script>
